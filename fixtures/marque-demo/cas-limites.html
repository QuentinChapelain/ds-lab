<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Orbe Café — cas limites</title>
  <style>
    body { margin: 0; font: 400 16px Arial, sans-serif; color: #1f2a44; background-color: #ffffff; }
    input, select { border: 1px solid #e2dccf; background-color: #ffffff; }
    input:focus-visible, select:focus-visible { outline: 3px solid #f0a500; }
    .champ-a { color: #7a1f1f; font-size: 13px; }
    .champ-b { color: #1f2a44; font-size: 15px; }
    .champ-b::placeholder { color: #8a8f98; opacity: 1; }
    .liste { color: #14532d; font-size: 17px; }
    .trois-bords { border-top: 2px solid #111111; border-bottom: 2px solid #b00020; border-left: 2px solid #111111; }
    .relief { box-shadow: 0 2px 4px #123456; outline: 2px solid #654321; text-decoration: underline; text-decoration-color: #abcdef; }
    .degrade { background-image: linear-gradient(#fedcba, #0fedcb); }
    .action { display: inline-block; color: #ffffff; background-color: #2b4c7e; text-decoration: none; transition: background-color .2s ease; }
    .action:hover { background-color: #1b3355; }
    .action:focus-visible { outline: 3px solid #f0a500; }
    .action:active { background-color: #10203a; }
    .bandeau { position: relative; height: 120px; }
    .fond { position: absolute; inset: 0; width: 100%; height: 100%; }
    .sur-image { position: relative; margin: 0; color: #ffffff; }
    .zone { position: relative; height: 80px; }
    .pave { position: absolute; top: 0; left: 0; width: 240px; height: 60px; background-color: #000000; }
    .pose { position: absolute; top: 10px; left: 10px; color: #f5f5f5; }
    .rond { fill: #c8553d; stroke: #2b4c7e; }
    .normal { color: #33415c; }
  </style>
</head>
<body>
  <input id="nom" class="champ-a" value="Ada">
  <input id="ville" class="champ-b" placeholder="Ville">
  <select id="pays" class="liste"><option>France</option></select>
  <input id="accord" type="checkbox" checked>
  <div class="trois-bords">Bords</div>
  <div class="relief">Relief</div>
  <div class="degrade">Dégradé</div>
  <a class="action" href="#agir">Agir</a>
  <div class="bandeau">
    <img class="fond" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100%25' height='100%25' fill='%23000'/%3E%3C/svg%3E">
    <p class="sur-image">Titre sur image</p>
  </div>
  <div class="zone"><div class="pave"></div><span class="pose">Posé sur un pavé</span></div>
  <svg class="picto" width="20" height="20" aria-hidden="true"><circle class="rond" cx="10" cy="10" r="8"/></svg>
  <p class="normal">Texte normal</p>
</body>
</html>
