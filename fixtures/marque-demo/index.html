<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Orbe Café — accueil</title>
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="{{ORIGINE_DISTANTE}}/styles/remote.css">
  <style>
    .hero { display: grid; gap: 1rem 2rem; margin-bottom: 2em; }
    .hero .accroche { font-size: 1.25rem; font-weight: 300; letter-spacing: .02em; }
    .invisible { visibility: hidden; color: #ff00ff; }
    @media (min-width: 480px) { .hero { padding: 24px; } }
  </style>
  <script>
    const feuille = new CSSStyleSheet();
    feuille.replaceSync('.etiquette { letter-spacing: 1px; text-transform: uppercase; }');
    document.adoptedStyleSheets = [feuille];
  </script>
</head>
<body>
  <header class="entete">
    <a class="logo" href="/">Orbe Café</a>
    <a href="/page-2.html">Carte</a>
  </header>
  <main>
    <section class="hero">
      <h1>Le café de quartier</h1>
      <p class="accroche">Torréfié chaque matin.</p>
      <a class="bouton" role="button" href="#commande">Commander</a>
    </section>
    <div class="carte">
      <img class="vignette" alt="Tasse" width="48" height="48" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'/%3E">
      <label for="courriel">Votre e-mail</label>
      <input id="courriel" class="champ" type="email">
      <span class="badge etiquette">Nouveau</span>
      <span class="badge badge--inactif etiquette">Épuisé</span>
      <p class="note">Prix TTC.</p>
      <p class="cache" hidden>Texte caché</p>
      <p class="invisible">Brouillon</p>
    </div>
    <a class="lien-discret" href="#plan">Plan du site</a>
  </main>
  <footer class="pied">
    <p>© Orbe Café</p>
    <a href="#mentions">Mentions</a>
  </footer>
</body>
</html>
