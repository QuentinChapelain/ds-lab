# Rejoue, sur des machines neuves, ce que CLAUDE.md demande avant un commit, en trois jobs parallèles et un verdict :
# - rapides : types, ce qui ne sert plus (knip), cycles et orphelins (dependency-cruiser), les trois contrôles de la cible ;
# - tests : npm test, en trois parts (un fichier de test dans une part et une seule) ;
# - atelier : son installation, sa version construite, puis la preuve (D42), un job par composant ;
# - controles : le verdict, seul check exigé par le ruleset de main (D35).
# Une étape par commande : la ligne rouge dit laquelle échoue.
name: CI

on:
  push:
    branches: ['**'] # toute branche, pas les étiquettes
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur une branche annule l'exécution encore en cours de cette branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapides:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Actions épinglées par empreinte : une étiquette peut être déplacée sans trace dans ce dépôt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # aucune étape ne pousse
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version # seule source de la version de Node (D40) ; une autre majeure, et les commandes sortent en 2
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npm run knip
      - run: npm run dependances
      - run: npm run contraste
      - run: npm run espacements
      - run: npm run typo

  tests:
    name: tests (${{ matrix.part }}/3)
    runs-on: ubuntu-24.04
    # Image officielle de Playwright, à la version de playwright-core (package.json) : Chromium et ses dépendances
    # système y sont déjà, aucun paquet apt n'est tiré pendant la CI. Épinglée par empreinte ; à monter avec
    # playwright-core. git y est, pour les tests qui lisent le dépôt.
    # --user 1001 : l'utilisateur du runner, propriétaire du dossier de travail monté (git refuse sinon un dépôt
    # d'un autre propriétaire) ; --ipc=host : la mémoire partagée de l'hôte, que Chromium demande dans un conteneur.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false # une part rouge laisse finir les autres : tous les échecs se lisent dans la même exécution
      matrix:
        part: [1, 2, 3]
    timeout-minutes: 7 # 125 à 232 s mesurés (D53)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version # passe devant le Node de l'image
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Trace : node --test lance au plus availableParallelism() - 1 fichiers à la fois.
      - name: Processeurs du runner
        run: echo "nproc $(nproc), availableParallelism $(node -p 'require("node:os").availableParallelism()')"
      # Chromium de l'image, lancé comme les commandes le lancent (D34) : un écart de version entre l'image et
      # playwright-core rougit ici, et non au milieu des tests.
      - name: Chromium de l'image
        run: node --input-type=module -e "import { lancerChromium } from './src/browser/lancement.js'; const b = await lancerChromium(); console.log('Chromium', b.version()); await b.close();"
        timeout-minutes: 1
      # L'option de la part passe par NODE_OPTIONS : écrite après le motif de npm test, node --test l'ignorerait.
      - name: npm test, part ${{ matrix.part }}/3
        run: npm test
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.part }}/3
        timeout-minutes: 5 # 87 à 183 s mesurés selon la part et le runner (D53)

  # Un job par composant : la preuve de chacun passe seule (node preuve.js <composant>), avec les mêmes vérifications
  # que la preuve entière, qui reste la commande d'avant commit.
  atelier:
    name: atelier (${{ matrix.composant }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        composant: [bouton, champ, carte, bouton-icone, avatar, etiquette]
    timeout-minutes: 4 # 75 à 101 s mesurés (D53)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          # Le cache de npm suit les deux verrous : celui de la racine et celui de l'atelier.
          cache-dependency-path: |
            package-lock.json
            atelier/package-lock.json
      # La preuve emprunte à la racine le lancement de Chromium, le lecteur des jetons et la comparaison de pixels.
      - run: npm ci
      - name: Chromium de l'image
        run: node --input-type=module -e "import { lancerChromium } from './src/browser/lancement.js'; const b = await lancerChromium(); console.log('Chromium', b.version()); await b.close();"
        timeout-minutes: 1
      - name: Atelier, installation
        run: npm ci --prefix atelier
        timeout-minutes: 3
      - name: Atelier, version construite
        run: npm --prefix atelier run build
        timeout-minutes: 3
      - name: Atelier, preuve du composant ${{ matrix.composant }}
        run: npm --prefix atelier run preuve -- ${{ matrix.composant }}
        timeout-minutes: 2 # 29 à 46 s mesurés (D53)

  # Seul check exigé par le ruleset de main (D35) : renommer ce job bloquerait tout push sur main. Il tourne toujours
  # et juge lui-même le résultat des autres : un job requis sauté compterait sinon comme réussi. Le résultat d'une
  # matrice (tests, atelier) n'est success que si chacun de ses jobs l'est.
  controles:
    if: always()
    needs: [rapides, tests, atelier]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verdict des jobs
        env:
          RAPIDES: ${{ needs.rapides.result }}
          TESTS: ${{ needs.tests.result }}
          ATELIER: ${{ needs.atelier.result }}
        run: |
          echec=0
          for job in "rapides:$RAPIDES" "tests:$TESTS" "atelier:$ATELIER"; do
            nom=${job%%:*}; resultat=${job#*:}
            if [ "$resultat" = success ]; then echo "$nom : $resultat"; else echo "::error::$nom : $resultat"; echec=1; fi
          done
          exit $echec
